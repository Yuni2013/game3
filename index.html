    function generateMap(region){
      const types=region===1?["battle","battle","event","rest","battle","shop","elite"]:region===2?["battle","event","battle","elite","shop","rest","battle"]:["battle","elite","event","battle","rest","shop","elite"];

    }
    const NODE={battle:["⚔","전투"],elite:["☠","엘리트"],event:["✧","이벤트"],shop:["◈","상점"],rest:["♨","휴식"],boss:["♛","보스"]};

    function enemyChoices(kind){

      const ids=kind==="elite"?["elite_ogre","elite_hydra","elite_judge","elite_reaper","elite_sentinel"]:state.region===1?["slime","goblin","skeleton","bug","wolf"]:state.region===2?["berserker","mage","knight","thorn","minion"]:["knight","thorn","minion","mage","berserker"];
      return[pick(ids)];

    function effectValue(key){
      let v=0;
      for(const id of state.relics){v+=RELIC[id]?.effect[key]||0}
      const sr=state.startRelic?START_RELIC[state.startRelic]?.effect[key]||0:0;
      return v+sr;
    }
    function hasEffect(key){return effectValue(key)!==0}
    function startCombat(kind){
      const id=enemyChoices(kind)[0],base=ENEMIES[id],mult=1+(state.region-1)*.16,hp=Math.round(base.hp*mult);
      state.screen="combat";
      state.combat={kind,enemy:{id,name:base.name,icon:base.icon,maxHp:hp,hp,block:0,status:{},pattern:0,base},draw:shuffle(state.deck.map(x=>({...x}))),hand:[],discard:[],exhaust:[],turn:0,firstAttack:true,firstSkill:true,powers:{},keepBlock:false,hitsThisTurn:0,discardThisTurn:0,damageTakenThisCombat:0,firstExhaust:false};

    function drawCards(n){const c=state.combat;let count=0;for(let i=0;i<n&&c.hand.length<10;i++){if(!c.draw.length){if(!c.discard.length)break;c.draw=shuffle(c.discard);c.discard=[]}const x=c.draw.pop();if(x){c.hand.push(x);count++}}state.runStats.drawn+=count;if(count>=3&&effectValue("drawThresholdBlock"))state.player.block+=effectValue("drawThresholdBlock")}
    function applyBleed(n){const e=state.combat.enemy;e.status.bleed=(e.status.bleed||0)+n;state.runStats.bleedApplied+=n;if(effectValue("bleedBlock"))state.player.block+=effectValue("bleedBlock");checkAchievements()}

    function damageEnemy(amount,ignoreBlock=false,source="attack"){
      const c=state.combat,e=c.enemy,p=state.player;

    function statusHtml(obj){return Object.entries(obj).filter(([,v])=>v>0).map(([k,v])=>`<span class="status">${({poison:"☠ 독",bleed:"🩸 출혈",weak:"⇣ 약화",vuln:"✹ 취약",combo:"✦ 콤보",energyLoss:"⚡ 기력"})[k]||k} ${v}</span>`).join("")}
    function intent(){const e=state.combat.enemy,p=e.base.patterns[e.pattern%e.base.patterns.length],map={attack:"⚔ 공격",block:"🛡 방어",debuff:p[1]==="poison"?"☠ 독":p[1]==="weak"?"⇣ 약화":"✹ 취약",buff:"✦ 강화"};return `${map[p[0]]||"?"} ${p[2]??p[1]}`}

    function cardHtml(inst,i){const d=CARDS[inst.id];if(!d)return"";const cost=cardCost(d);return `<button class="card ${d.type} ${d.rarity}" onclick="playCard(${i})" ${state.player.energy<cost?"disabled":""}><span class="cost">${cost}</span><h3>${d.name}${inst.up?" +":""}</h3><p>${cardDesc(d,inst.up)}</p><small>${d.type} · ${d.rarity}${d.owner?" · 전용":""}</small></button>`}

    window.playCard=i=>{
      const c=state.combat,inst=c?.hand[i],d=inst&&CARDS[inst.id];if(!d||!c||state.screen!=="combat")return;

    window.eventChoice=i=>{const ok=state.event[i+1](state);if(!ok){toast("골드가 부족합니다.",true);return}if(checkDeath())return;saveRun();advance()};

    function renderShop(){
      state.screen="shop";state.shopCards=[randomCard(null,state.character),randomCard("rare",state.character),randomCard(null,state.character)];
      const shopRelics=RELICS.filter(r=>!state.relics.includes(r.id)).map(r=>r.id);
      state.shopRelic=shopRelics.length?pick(shopRelics):null;
      const item=(title,desc,cost,fn)=>`<div class="panel shop-item"><div><h3>${title}</h3><p>${desc}</p></div><button class="btn gold-btn" onclick="${fn}" ${state.gold<cost?"disabled":""}>${cost} ◈</button></div>`;
      const discount=1-effectValue("shopDiscount");
      app.innerHTML=`<section class="screen">${topbar()}<h1 class="title">공허 상점</h1><p class="sub" style="margin-bottom:14px">당신의 골드는 여기서만 빛납니다.</p>${state.shopCards.map((id,i)=>{const d=CARDS[id],cost=Math.floor((d.rarity==="legendary"?105:d.rarity==="rare"?62:38)*discount);return item(d.name,d.description,cost,`buyCard(${i},${cost})`)}).join("")}${state.shopRelic?item(RELIC[state.shopRelic].name,RELIC[state.shopRelic].description,Math.floor(115*discount),`buyRelic(${Math.floor(115*discount)})`):""}${item("치유의 병","HP를 18 회복합니다.",28,"buyHeal(28)")}${item("카드 제거","무작위 기본 카드를 덱에서 제거합니다.",state.removeCost,`removeShopCard(${state.removeCost})`)}<button class="btn" style="width:100%;margin-top:10px" onclick="advance()">상점 나가기</button></section>`;
    }
    window.buyCard=(i,c)=>{if(state.gold<c)return;state.gold-=c;addCard(state,state.shopCards[i]);state.shopCards.splice(i,1);toast("카드를 구입했습니다.");saveRun();renderShop()};
    window.buyRelic=c=>{if(state.gold<c||!state.shopRelic)return;state.gold-=c;gainRelic(state);state.shopRelic=null;saveRun();renderShop()};
    window.buyHeal=c=>{if(state.gold<c)return;state.gold-=c;heal(state,18);saveRun();renderShop()};
    function removeRandomCard(s){const idx=s.deck.findIndex(x=>["slash","guard","jab"].includes(x.id));if(idx>=0)s.deck.splice(idx,1);else if(s.deck.length)s.deck.splice(rng(0,s.deck.length-1),1)}
    window.removeShopCard=c=>{if(state.gold<c)return;state.gold-=c;removeRandomCard(state);state.removeCost+=20;toast("카드가 제거되었습니다.");saveRun();renderShop()};

    function renderRest(){state.screen="rest";app.innerHTML=`<section class="screen">${topbar()}<div class="panel" style="padding:20px;margin-top:28px"><div style="font-size:2.8rem">♨</div><h1 class="title">잿빛 휴식처</h1><p class="sub">불꽃이 잠시 공허를 밀어냅니다.</p></div><button class="panel choice" style="margin-top:15px" onclick="restHeal()"><h3>♥ 회복</h3><p>HP를 ${22+effectValue("restHeal")} 회복합니다.</p></button><button class="panel choice" onclick="renderUpgrade()"><h3>✦ 카드 강화</h3><p>덱의 카드 하나를 강화합니다.</p></button></section>`}
    window.restHeal=()=>{heal(state,22+effectValue("restHeal"));saveRun();advance()};
    function upgradeRandom(s){const x=pick(s.deck.filter(x=>!x.up));if(x)x.up=true}
    function renderUpgrade(){app.innerHTML=`<section class="screen">${topbar()}<h1 class="title">강화할 카드</h1><p class="sub">강화된 카드는 피해 또는 방어도가 증가합니다.</p><div class="reward-grid" style="margin-top:15px">${state.deck.map((x,i)=>{const d=CARDS[x.id];return `<button class="card ${d.type}" ${x.up?"disabled":""} onclick="upgradeCard(${i})"><span class="cost">${d.cost}</span><h3>${d.name}${x.up?" +":""}</h3><p>${cardDesc(d,true)}</p></button>`}).join("")}</div></section>`}
    window.upgradeCard=i=>{if(!state.deck[i]||state.deck[i].up)return;state.deck[i].up=true;toast("카드가 강화되었습니다!");saveRun();advance()};

    function renderCodex(){
      const data=codexTab==="cards"?CARD_LIST:codexTab==="relics"?RELICS:Object.entries(ENEMIES).map(([id,x])=>({id,name:x.name,description:x.boss?"보스":"공허의 적"}));
      const key=codexTab==="cards"?"cards":codexTab==="relics"?"relics":"enemies";
      app.innerHTML=`<section class="screen"><button class="btn" onclick="renderMenu()">← 메뉴</button><h1 class="title">도감</h1><div class="tabs">${["cards","relics","enemies"].map(x=>`<button class="btn ${x===codexTab?"primary":""}" onclick="setCodex('${x}')">${({cards:"카드",relics:"유물",enemies:"적"})[x]}</button>`).join("")}</div><div class="list-grid">${data.map(x=>{const known=profile.discovered[key].includes(x.id);return `<div class="codex-entry ${known?"":"unknown"}"><div><b>${known?x.name:"???"}</b><p>${known?(x.description||"발견한 기록"):"아직 발견하지 못했습니다."}</p></div><span>${known?"✓":"?"}</span></div>`}).join("")}</div></section>`;
    }
    window.setCodex=x=>{codexTab=x;renderCodex()};

    function achievementProgress(a){
      if(profile.achievements[a.id])return a.target;
      if(!state)return 0;
      if(a.stat==="wins")return profile.wins;
      if(a.stat==="casterClear")return state.character==="caster"&&state.completed?1:0;
      if(a.stat==="guardianClear")return state.character==="guardian"&&state.completed?1:0;
      if(a.stat==="plagueClear")return state.character==="plague"&&state.completed?1:0;
      if(a.stat==="relicDiscoveries")return profile.discovered.relics.length;
      return state.runStats?.[a.stat]||0;
    }
    function checkAchievements(){
      if(!state)return;
      ACHIEVEMENTS.forEach(a=>{
        if(profile.achievements[a.id])return;
        let value=achievementProgress(a);
        if(value>=a.target){
          profile.achievements[a.id]=true;
          if(!profile.unlockedStartRelics.includes(a.reward))profile.unlockedStartRelics.push(a.reward);
          if(a.id==="iron_wall"&&!profile.unlocked.includes("guardian"))profile.unlocked.push("guardian");
          if(a.id==="poison_master"&&!profile.unlocked.includes("plague"))profile.unlocked.push("plague");
          if(a.id==="void_scholar"&&!profile.unlocked.includes("caster"))profile.unlocked.push("caster");
          saveProfile();
          const reward=START_RELIC[a.reward];
          toast(`<b>★ 업적 달성!</b><br>${a.name}<br><small>${a.description}</small><br><b>보상 획득: ${reward?.icon||"◈"} ${reward?.name||a.reward}</b>`,false,true);
        }
      });
    }
    function renderAchievements(){
      const done=ACHIEVEMENTS.filter(a=>profile.achievements[a.id]).length;
      const unlocked=profile.unlockedStartRelics.length;
      app.innerHTML=`<section class="screen"><button class="btn" onclick="renderMenu()">← 메뉴</button><h1 class="title">업적 / 전리품</h1><div class="panel" style="padding:14px;margin:12px 0"><b>${done} / ${ACHIEVEMENTS.length} 업적 달성</b><div class="progress"><i style="width:${done/ACHIEVEMENTS.length*100}%"></i></div><p class="sub" style="font-size:.78rem;margin-top:7px">해금된 시작 유물 ${unlocked} / ${START_RELICS.length-1}</p></div><div class="tabs"><button class="btn ${achievementTab==="achievements"?"primary":""}" onclick="setAchievementTab('achievements')">업적</button><button class="btn ${achievementTab==="relics"?"primary":""}" onclick="setAchievementTab('relics')">시작 유물</button></div>${achievementTab==="achievements"?`<div class="list-grid">${ACHIEVEMENTS.map(a=>{const v=Math.min(achievementProgress(a),a.target),done=!!profile.achievements[a.id],r=START_RELIC[a.reward];return `<div class="panel achievement"><div><span class="badge ${done?"":"rare"}">${done?"해금 완료":"진행 중"}</span><h3>${a.name}</h3><p>${a.description}</p><div class="progress"><i style="width:${v/a.target*100}%"></i></div><p>${v} / ${a.target} · 보상: ${r?.icon||"◈"} ${r?.name||a.reward}</p></div><b>${done?"✓":"○"}</b></div>`}).join("")}</div>`:`<div class="list-grid">${START_RELICS.filter(r=>r.id!=="none").map(r=>{const open=profile.unlockedStartRelics.includes(r.id),a=achievementByReward(r.id);return `<div class="panel achievement ${open?"":"unknown"}"><div><h3>${r.icon} ${open?r.name:"???"}</h3><p>${open?r.description:`해금 조건: ${a?.name||"알 수 없음"}`}</p></div><b>${open?"✓":"🔒"}</b></div>`}).join("")}</div>`}</section>`;
    }
    window.setAchievementTab=x=>{achievementTab=x;renderAchievements()};

    function renderUnlocks(){app.innerHTML=`<section class="screen"><button class="btn" onclick="renderMenu()">← 메뉴</button><h1 class="title">영혼 해금</h1><div class="panel" style="padding:18px;margin:14px 0"><span class="logo" style="color:#f6c85f">SOUL SHARDS</span><div style="font-size:2.3rem;font-weight:800;color:var(--gold)">${profile.shards}</div><p class="sub">런의 실패와 승리에서 얻은 조각입니다.</p></div><div class="list-grid">${Object.values(CHARACTERS).filter(c=>c.id!=="gladiator").map(c=>`<div class="panel choice"><h3>${c.icon} ${c.name}</h3><p>${c.mechanic}</p><span class="badge">${profile.unlocked.includes(c.id)?"해금 완료":lockText(c.id)}</span></div>`).join("")}</div></section>`}
    function renderSettings(){app.innerHTML=`<section class="screen"><button class="btn" onclick="renderMenu()">← 메뉴</button><h1 class="title">설정</h1><div class="panel" style="padding:17px;margin-top:15px"><h2 style="margin-top:0">저장 관리</h2><p class="sub">현재 런과 영구 진행도는 브라우저에 자동 저장됩니다. 기존 저장 데이터는 새 필드와 병합됩니다.</p><button class="btn danger" style="margin-top:15px;width:100%" onclick="clearAll()">모든 저장 데이터 초기화</button></div></section>`}
    window.clearAll=()=>{[SAVE_KEY,OLD_SAVE_KEY,RUN_KEY,OLD_RUN_KEY].forEach(k=>localStorage.removeItem(k));loadProfile();toast("저장 데이터를 초기화했습니다.");renderMenu()};

    function fail(){
      if(!state)return;
      const seconds=Math.floor((Date.now()-state.start)/1000),shards=3+state.region+(state.tempShards||0);
      profile.shards+=shards;profile.bestRegion=Math.max(profile.bestRegion,state.region);saveProfile();localStorage.removeItem(RUN_KEY);
      const summary={region:state.region,kills:state.kills,gold:state.gold,relics:state.relics.length,time:formatTime(seconds),shards};state.runActive=false;
      app.innerHTML=`<section class="screen result fail"><p class="logo">VOID DECK</p><h1>RUN FAILED</h1><p class="sub">공허가 당신의 발자국을 삼켰습니다.</p><div class="panel summary">도달 지역 <b>${summary.region}</b><br>처치한 적 <b>${summary.kills}</b><br>획득 골드 <b>${summary.gold}</b><br>유물 <b>${summary.relics}</b><br>플레이 시간 <b>${summary.time}</b><br>영혼 조각 <b class="gold">+${summary.shards}</b></div><div class="menu-actions"><button class="btn primary" onclick="renderCharacterSelect()">다시 시작</button><button class="btn" onclick="renderMenu()">메인 메뉴</button></div></section>`;
    }
    function victory(){
      const seconds=Math.floor((Date.now()-state.start)/1000),shards=15+(state.tempShards||0);state.completed=true;
      profile.shards+=shards;profile.wins++;profile.bestRegion=3;
      if(!profile.unlocked.includes("assassin"))profile.unlocked.push("assassin");
      ["caster","guardian","plague"].forEach(id=>{if(!profile.unlocked.includes(id))profile.unlocked.push(id)});
      checkAchievements();saveProfile();localStorage.removeItem(RUN_KEY);
      const deck=state.deck.map(x=>CARDS[x.id]?.name+(x.up?"+":"")).join(" · ");state.runActive=false;
      app.innerHTML=`<section class="screen result win"><p class="logo">VOID DECK</p><h1>VICTORY</h1><p class="sub">VOID의 심장이 마침내 침묵합니다.</p><div class="panel summary">클리어 시간 <b>${formatTime(seconds)}</b><br>사용 캐릭터 <b>${CHARACTERS[state.character].name}</b><br>처치한 적 <b>${state.kills}</b><br>유물 <b>${state.relics.map(x=>RELIC[x]?.name).join(" · ")||"없음"}</b><br>영혼 조각 <b class="gold">+${shards}</b><hr style="border-color:#34415f">덱<br><small>${esc(deck)}</small></div><div class="menu-actions"><button class="btn primary" onclick="renderCharacterSelect()">새 런 시작</button><button class="btn" onclick="renderMenu()">메인 메뉴</button></div></section>`;
    }
    const formatTime=s=>`${Math.floor(s/60)}분 ${s%60}초`;
    function renderCurrent(){if(!state)return renderMenu();if(state.screen==="combat")renderCombat();else if(state.screen==="map")renderMap();else renderMap()}

    window.renderMenu=renderMenu;
    window.renderCharacterSelect=renderCharacterSelect;
    window.advance=advance;
    window.renderMap=renderMap;
    window.renderUpgrade=renderUpgrade;
    window.renderCodex=renderCodex;
    window.renderAchievements=renderAchievements;
    window.renderUnlocks=renderUnlocks;
    window.renderSettings=renderSettings;
    window.renderStartRelicSelect=renderStartRelicSelect;
    window.renderCodex=renderCodex;
    window.renderAchievements=renderAchievements;
    window.renderUnlocks=renderUnlocks;
    window.renderSettings=renderSettings;

    loadProfile();renderMenu();
  })();
  </script>
 </body>
</html>
