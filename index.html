<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Mini FPS - Target Range</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#8fc7ed;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#stats{
    position:absolute;
    left:18px;
    top:16px;

    font-size:20px;
    font-weight:bold;

    text-shadow:
        2px 2px 4px #333;
}

#ammo{
    position:absolute;
    right:20px;
    bottom:20px;

    font-size:28px;
    font-weight:bold;

    text-shadow:
        2px 2px 4px #333;
}

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    width:24px;
    height:24px;

    transform:translate(-50%,-50%);
}

#crosshair::before{
    content:"";

    position:absolute;

    left:0;
    top:11px;

    width:24px;
    height:2px;

    background:white;

    box-shadow:
        0 0 3px black;
}

#crosshair::after{
    content:"";

    position:absolute;

    left:11px;
    top:0;

    width:2px;
    height:24px;

    background:white;

    box-shadow:
        0 0 3px black;
}

#message{
    position:absolute;

    left:50%;
    top:15%;

    transform:translateX(-50%);

    font-size:30px;
    font-weight:bold;

    text-shadow:
        2px 2px 5px #333;

    text-align:center;

    white-space:nowrap;
}

#help{
    position:absolute;

    bottom:14px;
    left:50%;

    transform:translateX(-50%);

    font-size:14px;

    text-shadow:
        1px 1px 3px #333;

    opacity:.9;
}


/* MOBILE */

#mobileControls{
    display:none;

    position:fixed;
    inset:0;

    pointer-events:none;
}

#joystick{
    position:absolute;

    left:25px;
    bottom:30px;

    width:140px;
    height:140px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.7);

    background:
        rgba(0,0,0,.12);

    pointer-events:auto;
}

#joystickKnob{
    position:absolute;

    left:50%;
    top:50%;

    width:60px;
    height:60px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(255,255,255,.45);
}

.mobileButton{
    position:absolute;

    pointer-events:auto;

    color:white;

    font-weight:bold;

    border:
        2px solid
        rgba(255,255,255,.8);

    box-shadow:
        0 3px 8px #333;
}

#fireButton{
    right:25px;
    bottom:35px;

    width:90px;
    height:90px;

    border-radius:50%;

    background:
        rgba(210,45,45,.8);
}

#reloadButton{
    right:30px;
    bottom:145px;

    width:80px;
    height:45px;

    border-radius:12px;

    background:
        rgba(40,40,40,.8);
}

@media(pointer:coarse){

    #mobileControls{
        display:block;
    }

    #help{
        display:none;
    }

}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="stats">
        🎯 SCORE:
        <span id="score">0</span>
        &nbsp;&nbsp;
        🎯 TARGET:
        <span id="targets">5</span>
    </div>

    <div id="ammo">
        🔫
        <span id="magazine">12</span>
        /
        <span id="reserve">60</span>
    </div>

    <div id="crosshair"></div>

    <div id="message"></div>

    <div id="help">
        WASD 이동 · 마우스 조준 · 클릭 발사 · R 재장전
    </div>

</div>


<div id="mobileControls">

    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>

    <button
        id="fireButton"
        class="mobileButton">
        FIRE
    </button>

    <button
        id="reloadButton"
        class="mobileButton">
        RELOAD
    </button>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =========================
   화면
========================= */

let width =
    window.innerWidth;

let height =
    window.innerHeight;


function resize(){

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width;

    canvas.height =
        height;

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   맵
========================= */

const map = [

"1111111111111111",
"1000000000000001",
"1000011111000001",
"1000010001000001",
"1000010001000001",
"1000000001000001",
"1011110001011101",
"1000000001000001",
"1000011111000001",
"1000000000000001",
"1000110000110001",
"1000000000000001",
"1111111111111111"

];

const MAP_WIDTH = 16;
const MAP_HEIGHT = 13;


/* =========================
   플레이어
========================= */

const player = {

    x:2.5,
    y:2.5,

    angle:0,

    magazine:12,

    reserve:60,

    score:0

};


/* =========================
   과녁
========================= */

const targetPositions = [

    {x:11.5,y:2.5},
    {x:13.2,y:5.5},
    {x:4.5,y:7.5},
    {x:11.5,y:9.5},
    {x:7.5,y:11}

];


const targets =
    targetPositions.map(
        position => ({

            x:position.x,
            y:position.y,

            alive:true,

            hit:false

        })
    );


/* =========================
   입력
========================= */

const keys = {};

let firing=false;


document.addEventListener(
    "keydown",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=true;

        if(
            event.key.toLowerCase()==="r"
        ){

            reload();

        }

        if(
            event.key==="Enter" &&
            gameFinished
        ){

            restart();

        }

    }
);


document.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;

    }
);


/* =========================
   벽
========================= */

function isWall(x,y){

    if(
        x<0 ||
        y<0 ||
        x>=MAP_WIDTH ||
        y>=MAP_HEIGHT
    ){

        return true;

    }

    return (
        map[
            Math.floor(y)
        ][
            Math.floor(x)
        ]==="1"
    );

}


/* =========================
   각도
========================= */

function normalizeAngle(angle){

    return Math.atan2(
        Math.sin(angle),
        Math.cos(angle)
    );

}


/* =========================
   이동
========================= */

function movePlayer(dx,dy){

    const radius=.18;

    const newX =
        player.x+dx;

    const newY =
        player.y+dy;


    if(
        !isWall(
            newX+radius,
            player.y
        ) &&
        !isWall(
            newX-radius,
            player.y
        )
    ){

        player.x=newX;

    }


    if(
        !isWall(
            player.x,
            newY+radius
        ) &&
        !isWall(
            player.x,
            newY-radius
        )
    ){

        player.y=newY;

    }

}


/* =========================
   시야 체크
========================= */

function blocked(
    x1,
    y1,
    x2,
    y2
){

    const distance =
        Math.hypot(
            x2-x1,
            y2-y1
        );

    const steps =
        Math.ceil(
            distance*8
        );


    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        const x =
            x1+(x2-x1)*t;

        const y =
            y1+(y2-y1)*t;


        if(
            isWall(x,y)
        ){

            return true;

        }

    }

    return false;

}


/* =========================
   발사
========================= */

function shoot(){

    if(gameFinished)
        return;


    if(
        player.magazine<=0
    ){

        reload();

        return;

    }


    player.magazine--;

    updateHUD();


    let target=null;

    let closest=Infinity;


    for(
        const targetObject
        of targets
    ){

        if(
            !targetObject.alive
        )
            continue;


        const dx =
            targetObject.x-
            player.x;

        const dy =
            targetObject.y-
            player.y;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        const targetAngle =
            Math.atan2(
                dy,
                dx
            );


        const difference =
            Math.abs(
                normalizeAngle(
                    targetAngle-
                    player.angle
                )
            );


        /*
            과녁 판정 범위
        */

        if(
            difference<0.09 &&
            distance<closest &&
            !blocked(
                player.x,
                player.y,
                targetObject.x,
                targetObject.y
            )
        ){

            target =
                targetObject;

            closest =
                distance;

        }

    }


    if(target){

        target.alive=false;

        target.hit=true;

        player.score+=100;

        showMessage(
            "+100  HIT!"
        );


        if(
            targets.every(
                target =>
                !target.alive
            )
        ){

            gameFinished=true;

            document.getElementById(
                "message"
            ).textContent =
                "🎯 ALL TARGETS HIT!<br>Enter로 다시 시작";

        }

    }

}


/* =========================
   재장전
========================= */

function reload(){

    if(
        player.magazine>=12
    )
        return;


    if(
        player.reserve<=0
    )
        return;


    const amount =
        Math.min(
            12-player.magazine,
            player.reserve
        );


    player.magazine+=amount;

    player.reserve-=amount;

    updateHUD();

}


/* =========================
   마우스 조준
========================= */

canvas.addEventListener(
    "click",
    ()=>{

        if(
            matchMedia(
                "(pointer:fine)"
            ).matches
        ){

            if(
                document.pointerLockElement
                !==canvas
            ){

                canvas.requestPointerLock();

            }
            else{

                shoot();

            }

        }

    }
);


document.addEventListener(
    "mousemove",
    event=>{

        if(
            document.pointerLockElement
            ===canvas
        ){

            player.angle =
                normalizeAngle(
                    player.angle+
                    event.movementX*
                    .0027
                );

        }

    }
);


document.addEventListener(
    "mousedown",
    event=>{

        if(
            event.button===0 &&
            document.pointerLockElement
            ===canvas
        ){

            firing=true;

        }

    }
);


document.addEventListener(
    "mouseup",
    event=>{

        if(
            event.button===0
        ){

            firing=false;

        }

    }
);


/* =========================
   모바일 조이스틱
========================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );


let joystickX=0;
let joystickY=0;
let joystickActive=false;


function updateJoystick(event){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left+
        rect.width/2;

    const centerY =
        rect.top+
        rect.height/2;


    let x =
        event.clientX-centerX;

    let y =
        event.clientY-centerY;


    const max =
        rect.width*.38;


    const distance =
        Math.hypot(x,y);


    if(distance>max){

        x=
            x/distance*max;

        y=
            y/distance*max;

    }


    joystickX=
        x/max;

    joystickY=
        y/max;


    joystickKnob.style.transform=
        `translate(
            calc(-50% + ${x}px),
            calc(-50% + ${y}px)
        )`;

}


joystick.addEventListener(
    "pointerdown",
    event=>{

        joystickActive=true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(event);

    }
);


joystick.addEventListener(
    "pointermove",
    event=>{

        if(
            joystickActive
        ){

            updateJoystick(event);

        }

    }
);


joystick.addEventListener(
    "pointerup",
    ()=>{

        joystickActive=false;

        joystickX=0;
        joystickY=0;

        joystickKnob.style.transform=
            "translate(-50%,-50%)";

    }
);


/* =========================
   모바일 발사
========================= */

const fireButton =
    document.getElementById(
        "fireButton"
    );


fireButton.addEventListener(
    "pointerdown",
    ()=>{

        firing=true;

        shoot();

    }
);


fireButton.addEventListener(
    "pointerup",
    ()=>{

        firing=false;

    }
);


/* =========================
   모바일 재장전
========================= */

document
.getElementById(
    "reloadButton"
)
.addEventListener(
    "pointerdown",
    reload
);


/* =========================
   모바일 조준
========================= */

let lookX=null;


canvas.addEventListener(
    "touchstart",
    event=>{

        for(
            const touch
            of event.changedTouches
        ){

            if(
                touch.clientX>
                width*.35 &&
                touch.clientX<
                width*.9
            ){

                lookX=
                    touch.clientX;

            }

        }

    },
    {passive:false}
);


canvas.addEventListener(
    "touchmove",
    event=>{

        for(
            const touch
            of event.changedTouches
        ){

            if(
                lookX!==null
            ){

                const difference =
                    touch.clientX-
                    lookX;


                player.angle =
                    normalizeAngle(
                        player.angle+
                        difference*.012
                    );


                lookX=
                    touch.clientX;

            }

        }

    },
    {passive:false}
);


canvas.addEventListener(
    "touchend",
    ()=>{
        lookX=null;
    },
    {passive:false}
);


/* =========================
   HUD
========================= */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent=
        player.score;


    document.getElementById(
        "magazine"
    ).textContent=
        player.magazine;


    document.getElementById(
        "reserve"
    ).textContent=
        player.reserve;


    document.getElementById(
        "targets"
    ).textContent=
        targets.filter(
            target =>
            target.alive
        ).length;

}


function showMessage(text){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent=text;


    setTimeout(
        ()=>{

            if(!gameFinished){

                message.textContent="";

            }

        },
        450
    );

}


/* =========================
   레이캐스팅
========================= */

function castRay(angle){

    const sin =
        Math.sin(angle);

    const cos =
        Math.cos(angle);


    let distance=0;

    const step=.025;


    while(
        distance<30
    ){

        distance+=step;


        const x =
            player.x+
            cos*distance;

        const y =
            player.y+
            sin*distance;


        if(
            isWall(x,y)
        ){

            return distance;

        }

    }


    return 30;

}


/* =========================
   화면 그리기
========================= */

function render(){

    /*
        밝은 하늘
    */

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height/2
        );


    sky.addColorStop(
        0,
        "#74bce8"
    );

    sky.addColorStop(
        1,
        "#d7f0ff"
    );


    ctx.fillStyle=sky;


    ctx.fillRect(
        0,
        0,
        width,
        height/2
    );


    /*
        밝은 바닥
    */

    const floor =
        ctx.createLinearGradient(
            0,
            height/2,
            0,
            height
        );


    floor.addColorStop(
        0,
        "#a9a9a9"
    );

    floor.addColorStop(
        1,
        "#686868"
    );


    ctx.fillStyle=floor;


    ctx.fillRect(
        0,
        height/2,
        width,
        height/2
    );


    /*
        벽
    */

    const FOV =
        Math.PI/3;


    const columns =
        Math.max(
            180,
            Math.floor(width/3)
        );


    const columnWidth =
        width/columns;


    for(
        let i=0;
        i<columns;
        i++
    ){

        const rayAngle =
            player.angle-
            FOV/2+
            i/(columns-1)*FOV;


        const distance =
            castRay(rayAngle);


        const correctedDistance =
            distance*
            Math.cos(
                rayAngle-
                player.angle
            );


        const wallHeight =
            Math.min(
                height*2,
                height/
                (
                    correctedDistance*
                    .72
                )
            );


        const top =
            (height-wallHeight)/2;


        /*
            기존보다 훨씬 밝게
        */

        const brightness =
            Math.max(
                90,
                235-
                correctedDistance*10
            );


        ctx.fillStyle=
            `rgb(
                ${brightness*.68},
                ${brightness*.78},
                ${brightness*.90}
            )`;


        ctx.fillRect(
            i*columnWidth,
            top,
            columnWidth+1,
            wallHeight
        );

    }


    /*
        과녁
    */

    const visibleTargets =
        targets
        .filter(
            target =>
            target.alive
        )
        .map(
            target=>{

                const dx =
                    target.x-
                    player.x;

                const dy =
                    target.y-
                    player.y;


                const distance =
                    Math.hypot(
                        dx,
                        dy
                    );


                const angle =
                    normalizeAngle(
                        Math.atan2(
                            dy,
                            dx
                        )-
                        player.angle
                    );


                return {
                    target,
                    distance,
                    angle
                };

            }
        )
        .filter(
            data=>{

                return (
                    Math.abs(
                        data.angle
                    )<
                    FOV*.65
                    &&
                    !blocked(
                        player.x,
                        player.y,
                        data.target.x,
                        data.target.y
                    )
                );

            }
        )
        .sort(
            (a,b)=>
                b.distance-
                a.distance
        );


    for(
        const data
        of visibleTargets
    ){

        const target =
            data.target;


        const screenX =
            width/2+
            Math.tan(
                data.angle
            )*
            (
                width/
                (
                    2*
                    Math.tan(
                        FOV/2
                    )
                )
            );


        const size =
            Math.min(
                height*.9,
                height/
                (
                    data.distance*.72
                )
            );


        const centerY =
            height/2;


        /*
            과녁 기둥
        */

        ctx.fillStyle=
            "#5b4634";


        ctx.fillRect(
            screenX-
            size*.035,

            centerY-
            size*.1,

            size*.07,

            size*.75
        );


        /*
            과녁 원판
        */

        const radius =
            size*.27;


        ctx.fillStyle=
            "#eeeeee";


        ctx.beginPath();

        ctx.arc(
            screenX,
            centerY-
            size*.12,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
            바깥 링
        */

        ctx.fillStyle=
            "#d82f2f";


        ctx.beginPath();

        ctx.arc(
            screenX,
            centerY-
            size*.12,
            radius*.78,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
            흰색 링
        */

        ctx.fillStyle=
            "#ffffff";


        ctx.beginPath();

        ctx.arc(
            screenX,
            centerY-
            size*.12,
            radius*.57,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
            빨간 중앙
        */

        ctx.fillStyle=
            "#d82f2f";


        ctx.beginPath();

        ctx.arc(
            screenX,
            centerY-
            size*.12,
            radius*.32,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
            검은 중심점
        */

        ctx.fillStyle=
            "#111";


        ctx.beginPath();

        ctx.arc(
            screenX,
            centerY-
            size*.12,
            radius*.13,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /*
        총
    */

    ctx.save();


    ctx.translate(
        width*.73,
        height*.79
    );


    ctx.rotate(
        -.05
    );


    ctx.fillStyle=
        "#252525";


    ctx.fillRect(
        -25,
        -10,
        95,
        75
    );


    ctx.fillStyle=
        "#555";


    ctx.fillRect(
        5,
        -28,
        38,
        30
    );


    ctx.fillStyle=
        "#111";


    ctx.fillRect(
        65,
        5,
        45,
        20
    );


    ctx.restore();

}


/* =========================
   업데이트
========================= */

let gameFinished=false;

let lastTime=
    performance.now();


function update(delta){

    if(gameFinished)
        return;


    let moveX=0;
    let moveY=0;


    if(keys["w"])
        moveY+=1;

    if(keys["s"])
        moveY-=1;

    if(keys["a"])
        moveX-=1;

    if(keys["d"])
        moveX+=1;


    moveX+=joystickX;
    moveY-=joystickY;


    const length =
        Math.hypot(
            moveX,
            moveY
        )||1;


    const speed =
        delta*2.7;


    const cos =
        Math.cos(
            player.angle
        );


    const sin =
        Math.sin(
            player.angle
        );


    const forward =
        moveY/length;


    const side =
        moveX/length;


    const dx =
        (
            forward*cos-
            side*sin
        )*speed;


    const dy =
        (
            forward*sin+
            side*cos
        )*speed;


    movePlayer(
        dx,
        dy
    );


    /*
        자동 연사
    */

    if(
        firing &&
        player.magazine>0
    ){

        if(
            performance.now()%230<
            delta*100
        ){

            shoot();

        }

    }

}


/* =========================
   다시 시작
========================= */

function restart(){

    player.x=2.5;
    player.y=2.5;
    player.angle=0;

    player.magazine=12;
    player.reserve=60;

    player.score=0;


    targets.forEach(
        target=>{

            target.alive=true;
            target.hit=false;

        }
    );


    gameFinished=false;


    document.getElementById(
        "message"
    ).textContent="";


    updateHUD();

}


/* =========================
   게임 루프
========================= */

function gameLoop(time){

    const delta =
        Math.min(
            .05,
            (time-lastTime)/1000
        );


    lastTime=time;


    update(delta);

    render();


    requestAnimationFrame(
        gameLoop
    );

}


updateHUD();

requestAnimationFrame(
    gameLoop
);

</script>
