function generatePool(klass,targetCount,prefix){
 let i=0;const patterns=classPatterns[klass];
 while(CARDS.filter(c=>c.class===klass).length<targetCount){
  const p=patterns[i%patterns.length],n=Math.floor(i/patterns.length)+1,rarity=i%11===10?"영웅":i%4===3?"희귀":"일반";
  const effect=clone(p[2]); if(effect.damage)effect.damage+=n%5*2;if(effect.block)effect.block+=n%4*2;if(effect.heal)effect.heal+=n%3;
  const cost=rarity==="영웅"?Math.min(3,(i%3)+1):i%7===0?0:(i%3)+1;
  const upgrade=effect.damage?{damage:rarity==="영웅"?7:3}:effect.block?{block:4}:effect.heal?{heal:3}:{draw:1};
  addCard(`${prefix}_${i}`,`${p[0]} ${n}`,klass,rarity,p[1],cost,effect,[...p[3],rarity==="영웅"?"고비용":""].filter(Boolean),upgrade,rarity==="영웅"?3:0);i++;
 }
}

 $("mapStatus").innerHTML=`<span class="chip hp">♥ ${game.player.hp}/${game.player.maxHp}</span><span class="chip gold">✦ ${game.gold}</span><span class="chip">덱 ${game.deck.length}</span><span class="chip">유물 ${game.relics.length}</span>`;
 const opts=game.floor>=9?[{kind:"boss",icon:"👑",name:"최종 보스",desc:"공허의 왕이 기다립니다."}]:shuffle([{kind:"combat",icon:"⚔️",name:"일반 전투",desc:"골드와 카드 보상"},{kind:"event",icon:"❓",name:"미지의 방",desc:"선택이 운명을 바꿉니다"},{kind:"shop",icon:"🛒",name:"떠돌이 상점",desc:"카드 구매 또는 제거"},{kind:"rest",icon:"🔥",name:"휴식처",desc:"회복 또는 카드 강화"},{kind:"elite",icon:"💀",name:"엘리트",desc:"강한 적 · 유물 보상"}]).slice(0,3);
 $("nodes").innerHTML="";opts.forEach(o=>{const b=document.createElement("button");b.className="node";b.innerHTML=`<span class="node-icon">${o.icon}</span><span><b>${o.name}</b><small>${o.desc}</small></span>`;b.onclick=()=>chooseNode(o.kind);$("nodes").appendChild(b)});
}
function chooseNode(kind){if(kind==="combat")startCombat(rand(["bat","crystalBat","golem","iceGolem","slime","spirit","priestEnemy","mageEnemy"]),"combat");else if(kind==="elite")startCombat("knight","elite");else if(kind==="boss")startCombat(game.floor>=11?"voidKing":game.floor>=9?"flameLord":"boss","boss");else if(kind==="shop")showShop();else if(kind==="event")showEvent();else showRest()}
function startCombat(key,kind){
 const base=ENEMIES[key];discoverEnemy(key);game.enemy={...clone(base),maxHp:base.hp,block:0,turn:0,status:{weak:0,vulnerable:0,poison:0,burn:0,freeze:0},kind,key};game.hand=[];game.drawPile=shuffle(game.deck.map(clone));game.discardPile=[];game.exhaustPile=[];game.block=relicValue("startBlock");game.energy=3+relicValue("energy")+relicValue("firstEnergy");game.turnStats={cards:0,firstAttack:true,firstSkill:true};show("combat");if(relicValue("startDamage"))damageEnemy(relicValue("startDamage"),false);drawCards(5+relicValue("draw"));setLog(`${game.enemy.name}이(가) 모습을 드러냈습니다.`);renderCombat();
}
function drawCards(n){for(let i=0;i<n;i++){if(!game.drawPile.length){if(!game.discardPile.length)break;game.drawPile=shuffle(game.discardPile.splice(0))}game.hand.push(game.drawPile.pop())}}
function damageEnemy(amount,useModifiers=true){
 const e=game.enemy;if(useModifiers){amount+=game.player.status.strength||0;if(e.status.vulnerable)amount=Math.floor(amount*1.5);amount+=relicValue("exhaustDamage")*game.exhaustPile.length;if(game.turnStats.firstAttack){amount+=relicValue("firstDamage");game.turnStats.firstAttack=false}}
 const absorb=Math.min(e.block,amount);e.block-=absorb;e.hp-=amount-absorb;setLog(`${e.name}에게 ${amount-absorb} 피해를 입혔습니다.`);
}
function damagePlayer(amount){
 const p=game.player;if(p.status.vulnerable)amount=Math.floor(amount*1.5);if(p.status.weak)amount=Math.ceil(amount*.75);const hit=Math.max(0,amount-game.block);game.block=Math.max(0,game.block-amount);p.hp-=hit;return hit;
}
function applyEffect(effect){
 const p=game.player,e=game.enemy;
 if(effect.damage){const hits=effect.multiHit||1;for(let i=0;i<hits;i++)damageEnemy(effect.damage,true)}
 if(effect.block)game.block+=effect.block+(p.status.dexterity||0);
 if(effect.draw)drawCards(effect.draw);
 if(effect.energy)game.energy+=effect.energy;
 if(effect.heal){const old=p.hp;p.hp=Math.min(p.maxHp,p.hp+effect.heal);game.runHeal+=p.hp-old}
 if(effect.strength)p.status.strength+=effect.strength;if(effect.dexterity)p.status.dexterity+=effect.dexterity;if(effect.focus)p.status.focus+=effect.focus;
 ["vulnerable","weak","poison","burn","freeze"].forEach(k=>{if(effect[k])e.status[k]=(e.status[k]||0)+effect[k]});
 if(effect.loseHp)p.hp-=effect.loseHp;
 if(effect.discard){for(let i=0;i<effect.discard&&game.hand.length;i++)game.discardPile.push(game.hand.pop())}
 if(effect.recoverDiscard&&game.discardPile.length)game.hand.push(game.discardPile.pop());
 if(effect.cleanse){["weak","vulnerable","poison","burn","freeze"].forEach(k=>p.status[k]=0)}
 if(effect.gold)addGold(effect.gold);
 if(effect.upgradeRandom){const a=game.deck.filter(c=>!c.upgraded);if(a.length)rand(a).upgraded=true}
}
function playCard(i){
 const c=game.hand[i],d=cardById(c.id),e=upgradedEffect(c);let cost=d.cost;
 if(d.type==="skill"&&game.turnStats.firstSkill&&hasRelic("ring"))cost=Math.max(0,cost-1);
 if(cost>game.energy)return;game.energy-=cost;game.turnStats.cards++;if(d.type==="skill")game.turnStats.firstSkill=false;applyEffect(e);discoverCard(c.id);
 game.hand.splice(i,1);if(e.exhaust)game.exhaustPile.push(c);else if(e.retain)game.hand.push(c);else game.discardPile.push(c);
 if(game.enemy.hp<=0){winCombat();return}if(game.player.hp<=0){gameOver();return}renderCombat();
}
function tickPlayerStatuses(){
 const p=game.player;if(p.status.poison){p.hp-=p.status.poison;setLog(`독으로 ${p.status.poison} 피해를 입었습니다.`)}if(p.status.burn){p.hp-=p.status.burn;setLog(`화상으로 ${p.status.burn} 피해를 입었습니다.`)}["weak","vulnerable","freeze"].forEach(k=>{if(p.status[k])p.status[k]--});
}
function endTurn(){
 game.discardPile.push(...game.hand.splice(0));const e=game.enemy,act=e.pattern[e.turn%e.pattern.length];
 if(e.status.poison){e.hp-=e.status.poison;if(e.hp<=0){winCombat();return}}if(e.status.burn){e.hp-=e.status.burn;if(e.hp<=0){winCombat();return}}
 if(e.status.freeze){e.status.freeze--;setLog(`${e.name}은(는) 빙결로 행동하지 못했습니다.`)}
 else if(act.type==="block"){e.block+=act.value;setLog(`${e.name}이(가) 방어도 ${act.value}을 얻었습니다.`)}
 else if(act.type==="heal"){e.hp=Math.min(e.maxHp,e.hp+act.value);setLog(`${e.name}이(가) HP를 ${act.value} 회복했습니다.`)}
 else{const hit=damagePlayer(act.value);if(act.type==="weak")game.player.status.weak++;if(act.type==="vulnerable")game.player.status.vulnerable++;if(act.type==="poison")game.player.status.poison+=2;if(act.type==="burn")game.player.status.burn+=2;if(act.type==="freeze")game.player.status.freeze++;setLog(`${e.name}의 공격! ${hit} 피해.`)}
 e.turn++;game.block=0;game.block+=relicValue("endBlock");tickPlayerStatuses();if(game.player.hp<=0){gameOver();return}
 ["weak","vulnerable","freeze"].forEach(k=>{if(e.status[k])e.status[k]--});game.energy=3+relicValue("energy")+(game.player.status.focus||0);game.turnStats={cards:0,firstAttack:true,firstSkill:true};drawCards(5);renderCombat();
}
function renderCombat(){
 const p=game.player,e=game.enemy;$("playerStatus").innerHTML=`<div><b>${p.name}</b><div class="status-strip" style="margin-top:7px"><span class="hp">♥ ${p.hp}/${p.maxHp}</span><span class="block">🛡 ${game.block}</span></div><div class="status-strip">${statusText(p.status)}</div></div><div class="energy" style="font-size:20px;font-weight:900">⚡ ${game.energy}</div>`;
 $("enemyArt").textContent=e.art;$("enemyName").textContent=e.name;$("enemyHpText").textContent=`HP ${Math.max(0,e.hp)} / ${e.maxHp}${e.block?` · 🛡 ${e.block}`:""}`;$("enemyHpBar").style.width=`${Math.max(0,e.hp/e.maxHp*100)}%`;$("enemyStatus").innerHTML=statusText(e.status);$("intent").textContent="다음 행동: "+e.pattern[e.turn%e.pattern.length].label;
 $("hand").innerHTML="";game.hand.forEach((c,i)=>{const d=cardById(c.id),cost=d.cost-(d.type==="skill"&&game.turnStats.firstSkill&&hasRelic("ring")?1:0),b=document.createElement("button");b.className=`card ${d.type}`;b.disabled=cost>game.energy;b.innerHTML=`<span class="cost">${Math.max(0,cost)}</span><div class="card-name">${d.name}${c.upgraded?" +":""}</div><div class="card-desc">${cardDescription(c)}</div><div class="card-type">${d.type==="attack"?"공격":d.type==="skill"?"스킬":"파워"} · ${d.rarity}</div>`;b.onclick=()=>playCard(i);$("hand").appendChild(b)});
}
function addGold(n){game.gold+=Math.floor(n*(1+relicValue("goldRate")))}
function rewardCandidates(n){const p=game.player.class;const pool=CARDS.filter(c=>(c.class===p||c.class==="common")&&c.minFloor<=game.floor+1);return shuffle(pool.sort((a,b)=>(game.deck.filter(x=>x.id===a.id).length)-(game.deck.filter(x=>x.id===b.id).length))).slice(0,n)}
function winCombat(){
 const elite=game.enemy.kind==="elite",boss=game.enemy.kind==="boss";if(boss){victory();return}game.floor++;const gold=(elite?40:20)+relicValue("gold")+(elite?relicValue("eliteGold"):0);addGold(gold);if(hasRelic("cup"))game.player.hp=Math.min(game.player.maxHp,game.player.hp+relicValue("winHeal"));if(elite)meta.stats.eliteKills++;
 game.pending={elite,gold};show("choiceScreen");$("choiceTitle").textContent="전투 승리!";$("choiceText").textContent=`골드 +${gold}${elite?" · 엘리트 유물 보상":""}`;const picks=rewardCandidates(3);picks.forEach(c=>discoverCard(c.id));$("choiceContent").innerHTML=`<div class="reward-grid">${picks.map(c=>`<button class="choice reward-card" data-card="${c.id}"><strong>${c.name} · ${c.cost}⚡ <span class="${c.rarity==="영웅"?"hero":c.rarity==="희귀"?"rare":"common"}">${c.rarity}</span></strong><span>${effectText(c.effect)}</span></button>`).join("")}</div><button id="skipReward" class="ghost-button" style="width:100%" type="button">건너뛰기</button>`;document.querySelectorAll(".reward-card").forEach(b=>b.onclick=()=>finishReward(b.dataset.card));$("skipReward").onclick=()=>finishReward(null);saveMeta();checkAchievements();
}
function finishReward(id){if(id)game.deck.push(makeCard(id));if(game.pending.elite){const choices=RELICS.filter(r=>!game.relics.includes(r.id));if(choices.length){const r=rand(choices);game.relics.push(r.id);discoverRelic(r.id);$("choiceTitle").textContent="엘리트 유물 획득";$("choiceText").textContent=`${r.icon} ${r.name} — ${r.desc}`;$("choiceContent").innerHTML=`<button id="continueMap" class="main-button" type="button">계속 오르기</button>`;$("continueMap").onclick=showMap;return}}showMap()}
function showShop(){
 if(!game.shopStock.length)game.shopStock=rewardCandidates(4).map(c=>({id:c.id,price:c.rarity==="영웅"?130:c.rarity==="희귀"?85:50}));
 show("choiceScreen");$("choiceTitle").textContent="떠돌이 상점";$("choiceText").textContent=`보유 골드: ${game.gold} · 카드 제거 비용: 75 골드`;
 $("choiceContent").innerHTML=`<div class="shop-list">${game.shopStock.map(x=>{const c=cardById(x.id);return `<button class="choice shop-buy" data-id="${x.id}"><strong>${c.name} · ${x.price} 골드</strong><span>${c.rarity} · ${effectText(c.effect)}</span></button>`}).join("")||"<p class='muted'>카드 상품이 모두 팔렸습니다.</p>"}<button id="removeCard" class="choice"><strong>카드 제거 · 75 골드</strong><span>무작위 카드 1장을 덱에서 제거합니다.</span></button><button id="leaveShop" class="ghost-button" type="button">떠난다</button></div>`;
 document.querySelectorAll(".shop-buy").forEach(b=>b.onclick=()=>{const item=game.shopStock.find(x=>x.id===b.dataset.id);if(game.gold<item.price)return notice("골드가 부족합니다.");game.gold-=item.price;game.deck.push(makeCard(item.id));game.shopStock=game.shopStock.filter(x=>x!==item);meta.stats.shopBuys++;if(meta.stats.shopBuys>=5&&!meta.classes.includes("rogue"))meta.classes.push("rogue");saveMeta();checkAchievements();showShop()});
 $("removeCard").onclick=()=>{if(game.gold<75||game.deck.length<=1)return notice(game.gold<75?"골드가 부족합니다.":"덱에 카드가 부족합니다.");game.gold-=75;game.deck.splice(Math.floor(Math.random()*game.deck.length),1);showShop()};$("leaveShop").onclick=()=>{game.shopStock=[];advance()};
}
function showRest(){show("choiceScreen");$("choiceTitle").textContent="불꽃의 휴식처";$("choiceText").textContent="잠시 숨을 고르고 다음 여정을 준비합니다.";$("choiceContent").innerHTML=`<div class="reward-grid"><button id="heal" class="choice"><strong>휴식</strong><span>최대 HP의 30%를 회복합니다.</span></button><button id="upgrade" class="choice"><strong>카드 강화</strong><span>무작위 미강화 카드 한 장을 강화합니다.</span></button></div>`;$("heal").onclick=()=>{const old=game.player.hp;game.player.hp=Math.min(game.player.maxHp,game.player.hp+Math.ceil(game.player.maxHp*.3));game.runHeal+=game.player.hp-old;if(game.runHeal>=50&&!meta.classes.includes("priest"))meta.classes.push("priest");saveMeta();advance()};$("upgrade").onclick=()=>{const a=game.deck.filter(c=>!c.upgraded);if(a.length)rand(a).upgraded=true;advance()}}
function showEvent(){const events=[{title:"빛나는 제단",text:"황금빛 제단이 심장 박동처럼 빛납니다.",a:"힘을 바친다 · HP 8 감소, 영웅 카드 보상",b:"그냥 지나간다",fa:()=>{game.player.hp=Math.max(1,game.player.hp-8);const c=rand(CARDS.filter(x=>x.class===game.player.class&&x.rarity==="영웅"));game.deck.push(makeCard(c.id));discoverCard(c.id);advance()}},{title:"수상한 약초상",text:"이끼 향이 나는 약병을 건넵니다.",a:"약초를 받는다 · HP 18 회복",b:"거절한다",fa:()=>{const old=game.player.hp;game.player.hp=Math.min(game.player.maxHp,game.player.hp+18);game.runHeal+=game.player.hp-old;advance()}},{title:"부서진 상자",text:"먼지가 쌓인 상자가 길을 막고 있습니다.",a:"상자를 연다 · 골드 35",b:"떠난다",fa:()=>{addGold(35);advance()}}];const e=rand(events);show("choiceScreen");$("choiceTitle").textContent=e.title;$("choiceText").textContent=e.text;$("choiceContent").innerHTML=`<div class="reward-grid"><button id="eventA" class="choice"><strong>${e.a}</strong></button><button id="eventB" class="choice"><strong>${e.b}</strong></button></div>`;$("eventA").onclick=e.fa;$("eventB").onclick=advance}
function advance(){game.floor++;showMap()}
function achievementDefs(){return [
 {id:"first_step",name:"첫걸음",desc:"첫 전투에서 승리",test:()=>game.floor>=1,relic:"shield"},{id:"first_relic",name:"첫 유물",desc:"유물을 획득",test:()=>meta.relics.length>=1,relic:"ember"},{id:"collector25",name:"카드 수집가",desc:"카드 25장 발견",test:()=>meta.cards.length>=25,relic:"crystal"},{id:"collector50",name:"탐구자",desc:"카드 50장 발견",test:()=>meta.cards.length>=50},{id:"collector100",name:"백장의 서고",desc:"카드 100장 발견",test:()=>meta.cards.length>=100},{id:"collector150",name:"탑의 기록관",desc:"카드 150장 발견",test:()=>meta.cards.length>=150},{id:"collector200",name:"비전 수집가",desc:"카드 200장 발견",test:()=>meta.cards.length>=200},{id:"collector250",name:"거대한 도감",desc:"카드 250장 발견",test:()=>meta.cards.length>=250},{id:"collector300",name:"모든 가능성",desc:"카드 300장 발견",test:()=>meta.cards.length>=300},{id:"rich",name:"부자가 되다",desc:"150 골드 보유",test:()=>game.gold>=150,relic:"goldHeart"},{id:"elite",name:"엘리트 사냥꾼",desc:"엘리트 1회 처치",test:()=>meta.stats.eliteKills>=1,relic:"coin"},{id:"gladiator",name:"검투사의 길",desc:"검투사로 5층 도달",test:()=>game.player&&game.player.class==="gladiator"&&game.floor>=5,relic:"heart"},{id:"mage",name:"마도사의 길",desc:"마도사로 5층 도달",test:()=>game.player&&game.player.class==="mage"&&game.floor>=5,relic:"eye"},{id:"unbroken",name:"불굴",desc:"HP 10 이하로 전투 승리",test:()=>game.player&&game.player.hp<=10},{id:"deck",name:"거대한 덱",desc:"덱 20장 보유",test:()=>game.deck.length>=20},{id:"compress",name:"덱 압축",desc:"덱 8장 이하로 3층 도달",test:()=>game.deck.length<=8&&game.floor>=3},{id:"upgrade",name:"강화의 시작",desc:"카드 강화",test:()=>game.deck.some(c=>c.upgraded),relic:"ring"},{id:"mid",name:"탑의 중간",desc:"5층 도달",test:()=>game.floor>=5,relic:"sand"},{id:"conquer",name:"정상 정복",desc:"탑 정복",test:()=>meta.stats.clears>=1,relic:"void"},{id:"lucky",name:"행운의 시작",desc:"유물 3개 발견",test:()=>meta.relics.length>=3,relic:"hunter"}]}
function checkAchievements(){if(!game.player)return;achievementDefs().forEach(a=>{if(!meta.achievements.includes(a.id)&&a.test()){meta.achievements.push(a.id);if(a.relic&&!meta.startingRelics.includes(a.relic))meta.startingRelics.push(a.relic)}});saveMeta()}
function openSheet(type){

function showCodex(root){
 $("sheetTitle").textContent="탑의 도감";root.innerHTML=`<div class="filters"><input id="codexSearch" aria-label="카드 검색" placeholder="카드 이름 검색"><select id="codexFilter" aria-label="카드 필터"><option value="all">전체 카드</option><option value="gladiator">검투사</option><option value="mage">마도사</option><option value="rogue">도적</option><option value="priest">사제</option><option value="common">공용</option><option value="일반">일반</option><option value="희귀">희귀</option><option value="영웅">영웅</option><option value="attack">공격</option><option value="skill">스킬</option><option value="power">파워</option></select></div><p class="muted">카드 발견: ${meta.cards.length} / ${CARDS.length} · 유물: ${meta.relics.length}/${RELICS.length} · 적: ${meta.enemies.length}/${Object.keys(ENEMIES).length}</p><div id="codexList" class="codex-list"></div><div class="pager"><button id="prevPage" class="ghost-button" type="button">이전</button><span id="pageLabel"></span><button id="nextPage" class="ghost-button" type="button">다음</button></div><hr style="border-color:rgba(255,255,255,.1)"><h3>유물 도감</h3><div class="relic-grid">${RELICS.map(r=>`<div class="relic"><b>${meta.relics.includes(r.id)?`${r.icon} ${r.name}`:"???"}</b><span>${meta.relics.includes(r.id)?r.desc:"아직 발견하지 못했습니다."}</span></div>`).join("")}</div><h3>적 도감</h3>${Object.entries(ENEMIES).map(([id,e])=>`<div class="sheet-item"><strong>${meta.enemies.includes(id)?`${e.art} ${e.name}`:"???"}</strong><span>${meta.enemies.includes(id)?`HP ${e.hp}`:"아직 마주치지 못했습니다."}</span></div>`).join("")}`;
 const render=()=>{const q=$("codexSearch").value.trim(),f=$("codexFilter").value;const list=CARDS.filter(c=>(!q||c.name.includes(q))&&(f==="all"||c.class===f||c.rarity===f||c.type===f));const max=Math.max(0,Math.ceil(list.length/30)-1);codexPage=Math.min(codexPage,max);const part=list.slice(codexPage*30,codexPage*30+30);$("codexList").innerHTML=part.map(c=>{const found=meta.cards.includes(c.id);return `<button class="codex-card ${found?"":"unknown"}" data-codex="${c.id}"><strong>${found?c.name:"???"} ${found?`· ${c.rarity}`:""}</strong><span>${found?`${c.class==="common"?"공용":CLASSES[c.class].name} · ${c.type==="attack"?"공격":c.type==="skill"?"스킬":"파워"}`:"발견하지 못한 카드"}</span></button>`}).join("");$("pageLabel").textContent=`${codexPage*30+1}~${Math.min((codexPage+1)*30,list.length)} / ${list.length}`;document.querySelectorAll("[data-codex]").forEach(b=>b.onclick=()=>showCardDetail(b.dataset.codex))};$("codexSearch").oninput=()=>{codexPage=0;render()};$("codexFilter").onchange=()=>{codexPage=0;render()};$("prevPage").onclick=()=>{codexPage=Math.max(0,codexPage-1);render()};$("nextPage").onclick=()=>{codexPage++;render()};render();
}
function showCardDetail(id){const c=cardById(id);if(!meta.cards.includes(id))return; $("sheetTitle").textContent=c.name;$("sheetContent").innerHTML=`<div class="panel" style="padding:15px"><p><b>${CLASSES[c.class]?.name||"공용"} · ${c.rarity} · ${c.type}</b></p><p>비용: ⚡ ${c.cost}</p><p>${effectText(c.effect)}</p><p><b>강화:</b> ${effectText({...c.effect,...Object.fromEntries(Object.entries(c.upgrade).map(([k,v])=>[k,(c.effect[k]||0)+v]))})}</p><p>${c.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</p><p class="muted">발견됨</p></div><button id="backCodex" class="ghost-button" style="width:100%;margin-top:12px" type="button">도감으로 돌아가기</button>`;$("backCodex").onclick=()=>openSheet("codex")}
function gameOver(){checkAchievements();meta.stats.best=Math.max(meta.stats.best,game.floor);saveMeta();show("result");$("resultIcon").textContent="☠️";$("resultTitle").textContent="GAME OVER";$("resultText").textContent=`${game.floor}층에서 탑의 어둠에 쓰러졌습니다.`;$("restartButton").textContent="다시 시작"}
function victory(){game.floor=10;meta.stats.best=Math.max(meta.stats.best,10);meta.stats.clears++;checkAchievements();saveMeta();show("result");$("resultIcon").textContent="🎉";$("resultTitle").textContent="탑 정복!";$("resultText").textContent="공허의 왕을 쓰러뜨리고 에테르의 탑을 정복했습니다.";$("restartButton").textContent="새로운 런 시작"}

$("enterButton").onclick=startGame;$("endTurn").onclick=endTurn;$("deckButton").onclick=()=>openSheet("deck");$("relicButton").onclick=()=>openSheet("relic");$("combatDeckButton").onclick=()=>openSheet("deck");$("combatRelicButton").onclick=()=>openSheet("relic");$("achievementButton").onclick=()=>openSheet("achievements");$("codexButton").onclick=()=>openSheet("codex");$("closeSheet").onclick=()=>$("overlay").classList.remove("show");$("overlay").onclick=e=>{if(e.target===$("overlay"))$("overlay").classList.remove("show")};$("restartButton").onclick=()=>{show("start");renderStart()};renderStart();lucide.createIcons();
</script>
 </body>
</html>
