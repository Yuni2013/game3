<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Mini FPS</title>

<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #111;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
}

#stats {
    position: absolute;
    top: 15px;
    left: 15px;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 4px black;
}

#ammo {
    position: absolute;
    right: 20px;
    bottom: 20px;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 2px 2px 4px black;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 24px;
    height: 24px;
    transform: translate(-50%, -50%);
}

#crosshair::before {
    content: "";
    position: absolute;
    width: 24px;
    height: 2px;
    top: 11px;
    background: white;
}

#crosshair::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 24px;
    left: 11px;
    background: white;
}

#message {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    font-weight: bold;
    text-align: center;
    text-shadow: 2px 2px 5px black;
}

#help {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    opacity: 0.8;
    text-align: center;
}

#mobileControls {
    display: none;
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#joystick {
    position: absolute;
    left: 25px;
    bottom: 30px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08);
    pointer-events: auto;
}

#joystickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 60px;
    height: 60px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,255,255,.3);
}

.mobileButton {
    position: absolute;
    pointer-events: auto;
    border: 2px solid rgba(255,255,255,.5);
    color: white;
    font-weight: bold;
    border-radius: 50%;
}

#fireButton {
    right: 25px;
    bottom: 35px;
    width: 90px;
    height: 90px;
    background: rgba(220,40,40,.65);
}

#reloadButton {
    right: 35px;
    bottom: 145px;
    width: 80px;
    height: 45px;
    border-radius: 12px;
    background: rgba(30,30,30,.8);
}

@media (pointer: coarse) {
    #mobileControls {
        display: block;
    }

    #help {
        display: none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="stats">
        ❤️ HP: <span id="hp">100</span>
        &nbsp;&nbsp;
        🏆 SCORE: <span id="score">0</span>
    </div>

    <div id="ammo">
        🔫 <span id="magazine">12</span> /
        <span id="reserve">60</span>
    </div>

    <div id="crosshair"></div>

    <div id="message"></div>

    <div id="help">
        WASD 이동 · 마우스 조준 · 클릭 발사 · R 재장전 · Enter 재시작
    </div>

</div>

<div id="mobileControls">

    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>

    <button
        id="fireButton"
        class="mobileButton">
        FIRE
    </button>

    <button
        id="reloadButton"
        class="mobileButton">
        R
    </button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width = window.innerWidth;
let height = window.innerHeight;

function resizeCanvas() {

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


/* =========================
   MAP
========================= */

const map = [
    "1111111111111111",
    "1000000000000001",
    "1000011111000001",
    "1000010001000001",
    "1000010001000001",
    "1000000001000001",
    "1011110001011101",
    "1000000001000001",
    "1000011111000001",
    "1000000000000001",
    "1000110000110001",
    "1000000000000001",
    "1111111111111111"
];

const MAP_WIDTH = 16;
const MAP_HEIGHT = 13;


/* =========================
   PLAYER
========================= */

const player = {

    x: 2.5,
    y: 2.5,

    angle: 0,

    hp: 100,

    magazine: 12,

    reserve: 60,

    score: 0
};


/* =========================
   ENEMIES
========================= */

const enemyStartPositions = [

    { x: 11.5, y: 2.5 },
    { x: 13.2, y: 5.5 },
    { x: 4.5, y: 7.5 },
    { x: 11.5, y: 9.5 },
    { x: 7.5, y: 11 }

];

const enemies = enemyStartPositions.map(position => ({

    x: position.x,
    y: position.y,

    hp: 100,

    alive: true,

    attackTimer: 0

}));


/* =========================
   INPUT
========================= */

const keys = {};

let firing = false;

document.addEventListener("keydown", event => {

    keys[event.key.toLowerCase()] = true;

    if (event.key.toLowerCase() === "r") {

        reload();

    }

    if (event.key === "Enter" && gameOver) {

        restart();

    }

});

document.addEventListener("keyup", event => {

    keys[event.key.toLowerCase()] = false;

});


/* =========================
   HELPERS
========================= */

function isWall(x, y) {

    if (
        x < 0 ||
        y < 0 ||
        x >= MAP_WIDTH ||
        y >= MAP_HEIGHT
    ) {
        return true;
    }

    return map[Math.floor(y)][Math.floor(x)] === "1";
}


function normalizeAngle(angle) {

    return Math.atan2(
        Math.sin(angle),
        Math.cos(angle)
    );

}


function movePlayer(dx, dy) {

    const radius = 0.18;

    const newX = player.x + dx;
    const newY = player.y + dy;

    if (
        !isWall(newX + radius, player.y) &&
        !isWall(newX - radius, player.y)
    ) {

        player.x = newX;

    }

    if (
        !isWall(player.x, newY + radius) &&
        !isWall(player.x, newY - radius)
    ) {

        player.y = newY;

    }

}


/* =========================
   LINE OF SIGHT
========================= */

function blocked(x1, y1, x2, y2) {

    const distance = Math.hypot(
        x2 - x1,
        y2 - y1
    );

    const steps = Math.ceil(distance * 8);

    for (let i = 1; i < steps; i++) {

        const t = i / steps;

        const x =
            x1 + (x2 - x1) * t;

        const y =
            y1 + (y2 - y1) * t;

        if (isWall(x, y)) {

            return true;

        }

    }

    return false;

}


/* =========================
   SHOOT
========================= */

function shoot() {

    if (gameOver) return;

    if (player.magazine <= 0) {

        reload();

        return;

    }

    player.magazine--;

    updateHUD();

    let target = null;
    let targetDistance = Infinity;

    for (const enemy of enemies) {

        if (!enemy.alive) continue;

        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;

        const distance =
            Math.hypot(dx, dy);

        const enemyAngle =
            Math.atan2(dy, dx);

        const difference =
            Math.abs(
                normalizeAngle(
                    enemyAngle -
                    player.angle
                )
            );

        if (
            difference < 0.09 &&
            distance < targetDistance &&
            !blocked(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            )
        ) {

            target = enemy;
            targetDistance = distance;

        }

    }

    if (target) {

        target.hp -= 50;

        if (target.hp <= 0) {

            target.alive = false;

            player.score += 100;

            showMessage("ENEMY DOWN");

        } else {

            showMessage("HIT");

        }

    }

}


/* =========================
   RELOAD
========================= */

function reload() {

    if (gameOver) return;

    if (player.magazine >= 12) return;

    if (player.reserve <= 0) return;

    const amount =
        Math.min(
            12 - player.magazine,
            player.reserve
        );

    player.magazine += amount;

    player.reserve -= amount;

    updateHUD();

}


/* =========================
   MOUSE
========================= */

canvas.addEventListener("click", () => {

    if (
        matchMedia("(pointer:fine)").matches
    ) {

        if (
            document.pointerLockElement !== canvas
        ) {

            canvas.requestPointerLock();

        } else {

            shoot();

        }

    }

});


document.addEventListener("mousemove", event => {

    if (
        document.pointerLockElement === canvas
    ) {

        player.angle =
            normalizeAngle(
                player.angle +
                event.movementX * 0.0027
            );

    }

});


document.addEventListener("mousedown", event => {

    if (
        event.button === 0 &&
        document.pointerLockElement === canvas
    ) {

        firing = true;

    }

});


document.addEventListener("mouseup", event => {

    if (event.button === 0) {

        firing = false;

    }

});


/* =========================
   MOBILE JOYSTICK
========================= */

const joystick =
    document.getElementById("joystick");

const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );

let joystickActive = false;

let joystickX = 0;
let joystickY = 0;


function updateJoystick(event) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    let x =
        event.clientX - centerX;

    let y =
        event.clientY - centerY;

    const max =
        rect.width * 0.38;

    const distance =
        Math.hypot(x, y);

    if (distance > max) {

        x = x / distance * max;
        y = y / distance * max;

    }

    joystickX = x / max;
    joystickY = y / max;

    joystickKnob.style.transform =
        `translate(
            calc(-50% + ${x}px),
            calc(-50% + ${y}px)
        )`;

}


joystick.addEventListener(
    "pointerdown",
    event => {

        joystickActive = true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(event);

    }
);


joystick.addEventListener(
    "pointermove",
    event => {

        if (joystickActive) {

            updateJoystick(event);

        }

    }
);


joystick.addEventListener(
    "pointerup",
    () => {

        joystickActive = false;

        joystickX = 0;
        joystickY = 0;

        joystickKnob.style.transform =
            "translate(-50%, -50%)";

    }
);


/* =========================
   MOBILE FIRE
========================= */

const fireButton =
    document.getElementById(
        "fireButton"
    );

fireButton.addEventListener(
    "pointerdown",
    () => {

        firing = true;

        shoot();

    }
);

fireButton.addEventListener(
    "pointerup",
    () => {

        firing = false;

    }
);


/* =========================
   MOBILE RELOAD
========================= */

document
.getElementById("reloadButton")
.addEventListener(
    "pointerdown",
    reload
);


/* =========================
   MOBILE AIM
========================= */

let lookX = null;

canvas.addEventListener(
    "touchstart",
    event => {

        for (
            const touch of event.changedTouches
        ) {

            if (
                touch.clientX > width * 0.35 &&
                touch.clientX < width * 0.9
            ) {

                lookX = touch.clientX;

            }

        }

    },
    { passive: false }
);


canvas.addEventListener(
    "touchmove",
    event => {

        for (
            const touch of event.changedTouches
        ) {

            if (
                lookX !== null &&
                touch.clientX > width * 0.35
            ) {

                const difference =
                    touch.clientX - lookX;

                player.angle =
                    normalizeAngle(
                        player.angle +
                        difference * 0.012
                    );

                lookX = touch.clientX;

            }

        }

    },
    { passive: false }
);


canvas.addEventListener(
    "touchend",
    () => {

        lookX = null;

    },
    { passive: false }
);


/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById("hp")
        .textContent =
        Math.max(
            0,
            Math.round(player.hp)
        );

    document.getElementById("score")
        .textContent =
        player.score;

    document.getElementById("magazine")
        .textContent =
        player.magazine;

    document.getElementById("reserve")
        .textContent =
        player.reserve;

}


function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = text;

    setTimeout(() => {

        if (!gameOver) {

            message.textContent = "";

        }

    }, 400);

}


/* =========================
   RAYCAST
========================= */

function castRay(angle) {

    const sin =
        Math.sin(angle);

    const cos =
        Math.cos(angle);

    let distance = 0;

    const step = 0.025;

    while (distance < 30) {

        distance += step;

        const x =
            player.x + cos * distance;

        const y =
            player.y + sin * distance;

        if (isWall(x, y)) {

            return distance;

        }

    }

    return 30;

}


/* =========================
   RENDER
========================= */

function render() {

    /*
        SKY
    */

    ctx.fillStyle = "#26384b";

    ctx.fillRect(
        0,
        0,
        width,
        height / 2
    );


    /*
        FLOOR
    */

    ctx.fillStyle = "#17191d";

    ctx.fillRect(
        0,
        height / 2,
        width,
        height / 2
    );


    /*
        WALLS
    */

    const FOV =
        Math.PI / 3;

    const columns =
        Math.max(
            180,
            Math.floor(width / 3)
        );

    const columnWidth =
        width / columns;


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        const rayAngle =
            player.angle -
            FOV / 2 +
            (i / (columns - 1)) * FOV;

        const distance =
            castRay(rayAngle);

        const correctedDistance =
            distance *
            Math.cos(
                rayAngle -
                player.angle
            );

        const wallHeight =
            Math.min(
                height * 2,
                height /
                (correctedDistance * 0.72)
            );

        const top =
            (height -
             wallHeight) / 2;

        const brightness =
            Math.max(
                35,
                210 -
                correctedDistance * 17
            );

        ctx.fillStyle =
            `rgb(
                ${brightness * .45},
                ${brightness * .55},
                ${brightness * .70}
            )`;

        ctx.fillRect(
            i * columnWidth,
            top,
            columnWidth + 1,
            wallHeight
        );

    }


    /*
        ENEMIES
    */

    const visibleEnemies =
        enemies
        .filter(enemy => enemy.alive)
        .map(enemy => {

            const dx =
                enemy.x -
                player.x;

            const dy =
                enemy.y -
                player.y;

            const distance =
                Math.hypot(
                    dx,
                    dy
                );

            const angle =
                normalizeAngle(
                    Math.atan2(dy, dx) -
                    player.angle
                );

            return {
                enemy,
                distance,
                angle
            };

        })
        .filter(data => {

            return (
                Math.abs(data.angle) <
                FOV * 0.65 &&
                !blocked(
                    player.x,
                    player.y,
                    data.enemy.x,
                    data.enemy.y
                )
            );

        })
        .sort(
            (a, b) =>
            b.distance -
            a.distance
        );


    for (
        const data of visibleEnemies
    ) {

        const enemy =
            data.enemy;

        const screenX =
            width / 2 +
            Math.tan(data.angle) *
            (
                width /
                (
                    2 *
                    Math.tan(FOV / 2)
                )
            );

        const size =
            Math.min(
                height * 1.1,
                height /
                (data.distance * .72)
            );

        const top =
            height / 2 -
            size * .52;


        /*
            BODY
        */

        ctx.fillStyle =
            "#b72b2b";

        ctx.fillRect(
            screenX - size * .18,
            top + size * .12,
            size * .36,
            size * .7
        );


        /*
            HEAD
        */

        ctx.fillStyle =
            "#e04a36";

        ctx.beginPath();

        ctx.arc(
            screenX,
            top + size * .08,
            size * .2,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
            EYES
        */

        ctx.fillStyle =
            "white";

        ctx.fillRect(
            screenX - size * .09,
            top + size * .02,
            size * .055,
            size * .055
        );

        ctx.fillRect(
            screenX + size * .035,
            top + size * .02,
            size * .055,
            size * .055
        );

    }


    /*
        WEAPON
    */

    ctx.save();

    ctx.translate(
        width * .73,
        height * .79
    );

    ctx.rotate(-0.05);

    ctx.fillStyle =
        "#20242a";

    ctx.fillRect(
        -25,
        -10,
        95,
        75
    );

    ctx.fillStyle =
        "#444a52";

    ctx.fillRect(
        5,
        -28,
        38,
        30
    );

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        65,
        5,
        45,
        20
    );

    ctx.restore();

}


/* =========================
   GAME UPDATE
========================= */

let gameOver = false;

let lastTime =
    performance.now();


function update(delta) {

    if (gameOver) return;


    /*
        PLAYER MOVEMENT
    */

    let moveX = 0;
    let moveY = 0;


    if (keys["w"])
        moveY += 1;

    if (keys["s"])
        moveY -= 1;

    if (keys["a"])
        moveX -= 1;

    if (keys["d"])
        moveX += 1;


    moveX += joystickX;
    moveY -= joystickY;


    const length =
        Math.hypot(
            moveX,
            moveY
        ) || 1;


    const speed =
        delta * 2.7;


    const cos =
        Math.cos(player.angle);

    const sin =
        Math.sin(player.angle);


    const forward =
        moveY / length;

    const side =
        moveX / length;


    const dx =
        (
            forward * cos -
            side * sin
        ) * speed;


    const dy =
        (
            forward * sin +
            side * cos
        ) * speed;


    movePlayer(
        dx,
        dy
    );


    /*
        AUTOMATIC FIRE
    */

    if (
        firing &&
        player.magazine > 0
    ) {

        if (
            performance.now() % 230 <
            delta * 100
        ) {

            shoot();

        }

    }


    /*
        ENEMY AI
    */

    for (
        const enemy of enemies
    ) {

        if (!enemy.alive)
            continue;


        enemy.attackTimer -= delta;


        const dx =
            player.x -
            enemy.x;

        const dy =
            player.y -
            enemy.y;

        const distance =
            Math.hypot(
                dx,
                dy
            );


        /*
            MOVE TOWARDS PLAYER
        */

        if (
            distance > 1.3 &&
            !blocked(
                enemy.x,
                enemy.y,
                player.x,
                player.y
            )
        ) {

            const enemySpeed =
                delta * 0.42;

            const nx =
                enemy.x +
                dx / distance *
                enemySpeed;

            const ny =
                enemy.y +
                dy / distance *
                enemySpeed;


            if (
                !isWall(nx, enemy.y)
            ) {

                enemy.x = nx;

            }

            if (
                !isWall(enemy.x, ny)
            ) {

                enemy.y = ny;

            }

        }


        /*
            ATTACK PLAYER
        */

        if (
            distance < 7 &&
            !blocked(
                enemy.x,
                enemy.y,
                player.x,
                player.y
            ) &&
            enemy.attackTimer <= 0
        ) {

            player.hp -= 8;

            enemy.attackTimer =
                1.1;

            updateHUD();


            if (
                player.hp <= 0
            ) {

                gameOver = true;

                showMessage(
                    "GAME OVER<br>Enter로 재시작"
                );

                document.getElementById(
                    "message"
                ).innerHTML =
                    "GAME OVER<br>Enter로 재시작";

            }

        }

    }


    /*
        VICTORY
    */

    if (
        enemies.every(
            enemy => !enemy.alive
        )
    ) {

        gameOver = true;

        document.getElementById(
            "message"
        ).textContent =
            "VICTORY!  Enter로 재시작";

    }

}


/* =========================
   RESTART
========================= */

function restart() {

    player.x = 2.5;
    player.y = 2.5;
    player.angle = 0;

    player.hp = 100;

    player.magazine = 12;
    player.reserve = 60;

    player.score = 0;


    enemies.forEach(
        (enemy, index) => {

            enemy.x =
                enemyStartPositions[index].x;

            enemy.y =
                enemyStartPositions[index].y;

            enemy.hp = 100;

            enemy.alive = true;

            enemy.attackTimer = 0;

        }
    );


    gameOver = false;

    document.getElementById(
        "message"
    ).textContent = "";


    updateHUD();

}


/* =========================
   MAIN LOOP
========================= */

function gameLoop(time) {

    const delta =
        Math.min(
            0.05,
            (time - lastTime) / 1000
        );

    lastTime = time;


    update(delta);

    render();


    requestAnimationFrame(
        gameLoop
    );

}


updateHUD();

requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
