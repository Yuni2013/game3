      amount=Math.max(0,Math.round(amount*mod));state.combat.firstAttack=false;if(!ignoreBlock){const absorbed=Math.min(e.block,amount);e.block-=absorbed;amount-=absorbed}e.hp-=amount;float(`-${amount}`,"#ff8797");const enemyEl=$(".enemy");if(enemyEl){enemyEl.classList.remove("hit");void enemyEl.offsetWidth;enemyEl.classList.add("hit")}if(e.hp<=0)winCombat();return amount;

    function cardDesc(d,up){let text=d.description;if(up){if(d.damage)text=text.replace(String(d.damage),String(d.damage+3));if(d.block)text=text.replace(String(d.block),String(d.block+4))}return text}
    window.playCard=i=>{
      const c=state.combat, inst=c?.hand[i], d=inst&&CARDS[inst.id];if(!d||!c||state.screen!=="combat")return;let cost=Math.max(0,d.cost-(c.firstSkill&&d.type==="skill"&&state.relics.includes("quill")?1:0));if(state.player.energy<cost){toast("에너지가 부족합니다.",true);return}state.player.energy-=cost;c.firstSkill=false;const plus=inst.up?3:0,e=c.enemy;
      switch(d.id){
        case"slash":case"strike":case"bash":case"overpower":case"voidslash":case"assassinate":case"pierce":case"finale": damageEnemy(d.damage+plus,d.id==="pierce");break;
        case"guard":case"ironwall":case"quickguard":case"barrier":case"perfectguard":state.player.block+=d.block+plus;if(d.id==="quickguard")drawCards(1);if(d.id==="barrier")c.keepBlock=true;if(d.id==="perfectguard"&&c.hand.some(z=>CARDS[z.id]?.type==="attack"))state.player.energy++;break;
        case"focus":state.player.str=(state.player.str||0)+2+Math.floor(plus/2);break;
        case"jab":damageEnemy(d.damage+plus);state.player.status.combo=(state.player.status.combo||0)+1;break;
        case"bleedcut":damageEnemy(d.damage+plus);e.status.bleed=(e.status.bleed||0)+3+plus;break;
        case"poisonneedle":damageEnemy(d.damage+plus);e.status.poison=(e.status.poison||0)+4+plus;break;
        case"recover":heal(state,5+plus);break;case"feint":e.status.weak=(e.status.weak||0)+2;break;
        case"riposte":damageEnemy(Math.floor(state.player.block*1.2)+plus);break;
        case"fortify":c.powers.fortify=true;break;
        case"bloodletting":damageEnemy(9+plus+(e.status.bleed?6:0));break;
        case"toxicburst":damageEnemy((e.status.poison||0)*2+plus);e.status.poison=0;break;
        case"flurry":for(let k=0;k<3;k++)damageEnemy(3+plus);state.player.status.combo=(state.player.status.combo||0)+3;break;
        case"adrenaline":state.player.energy++;drawCards(2);break;
        case"execute":damageEnemy(10+plus+(e.hp<=e.maxHp/2?18:0));break;
        case"siphon":heal(state,Math.ceil(damageEnemy(7+plus)/2));break;
        case"shivstorm":for(let k=0;k<5;k++)damageEnemy(2+plus);break;
        case"meditate":drawCards(3);state.player.status.energyLoss=1;break;
        case"immortal":state.player.block+=12+plus;break;
        case"hemorrhage":damageEnemy(8+plus);e.status.bleed=(e.status.bleed||0)+8+plus;break;
        case"venomrain":e.status.poison=(e.status.poison||0)+12+plus;drawCards(1);break;
        case"echo":c.powers.echo=true;break;
        case"laststand":damagePlayer(10);state.player.energy+=3;drawCards(3);break;
        case"momentum":c.powers.momentum=true;break;
        case"drain":e.status.weak=(e.status.weak||0)+2;e.status.vuln=(e.status.vuln||0)+2;break;
        case"shieldbash":damageEnemy(Math.floor(state.player.block*.8)+plus);state.player.block=Math.floor(state.player.block/2);break;
        case"cleanse":heal(state,7+plus);state.player.status.weak=0;break;
        case"rage":c.powers.rage=true;break;
        case"sacrifice":damagePlayer(6);drawCards(3);break;
      }
      if(c.powers.echo&&d.type==="attack")damageEnemy(Math.max(1,Math.floor((d.damage||3)/2)));
      if(d.id==="finale")c.exhaust.push(inst);else c.discard.push(inst);c.hand.splice(i,1);discovered("cards",d.id);if(e.hp<=0)return;saveRun();renderCombat();
    };
    window.endTurn=()=>{
      const c=state.combat;if(!c||state.screen!=="combat")return;c.discard.push(...c.hand);c.hand=[];const e=c.enemy;
      if(e.status.bleed){e.hp-=e.status.bleed;float(`출혈 -${e.status.bleed}`,"#ff8190");e.status.bleed=Math.max(0,e.status.bleed-1)}
      if(e.hp<=0)return winCombat();
      const a=e.base.patterns[e.pattern%e.base.patterns.length];if(a[0]==="attack")damagePlayer(a[1]+(e.status.str||0));if(a[0]==="block")e.block+=a[1];if(a[0]==="buff")e.status[a[1]]=(e.status[a[1]]||0)+a[2];if(a[0]==="debuff"){const k=a[1],v=a[2];state.player.status[k]=(state.player.status[k]||0)+v;toast(`${e.name}: ${k==="poison"?"독":k==="weak"?"약화":"취약"} ${v}`)}
      e.pattern++;if(checkDeath())return;setTimeout(startPlayerTurn,220);
    };
    function winCombat(){
      if(!state.combat||state.screen!=="combat")return;const kind=state.combat.kind;state.kills++;profile.kills++;state.gold+=(kind==="boss"?55:kind==="elite"?42:22)+(state.relics.includes("lucky_coin")?8:0);if(state.relics.includes("vampire_fang"))heal(state,3);
      if(kind==="boss"){if(state.region===1&&!profile.unlocked.includes("assassin")){profile.unlocked.push("assassin");toast("암살자가 영구 해금되었습니다!")}state.combat=null;saveProfile();advance();return}
      const elite=kind==="elite";state.combat=null;renderReward(elite);
    }
    function randomCard(force){const r=force|| (Math.random()<.1?"rare":Math.random()<.4?"uncommon":"common");const arr=Object.values(CARDS).filter(c=>c.rarity===r);return pick(arr).id}
    function addCard(s,id){if(CARDS[id]){s.deck.push({id,up:false});discovered("cards",id)}}
    function gainRelic(s){const avail=RELICS.map(x=>x.id).filter(x=>!s.relics.includes(x));if(!avail.length){s.gold+=25;return}const id=pick(avail);s.relics.push(id);discovered("relics",id);toast(`유물 획득: ${RELIC[id].name}`)}
    function renderReward(elite){
      state.screen="reward";const opts=[randomCard(),randomCard(),randomCard()];
      app.innerHTML=`<section class="screen">${topbar()}<h1 class="title">${elite?"엘리트 격파":"전투 승리"}</h1><p class="sub">골드 획득! 덱에 추가할 카드 하나를 선택하세요.</p>${elite?`<button class="panel choice" onclick="claimEliteRelic()"><h3>✦ 유물 획득</h3><p>강한 적이 남긴 공허의 유물입니다.</p></button>`:""}<div class="reward-grid" style="margin-top:13px">${opts.map(id=>{const d=CARDS[id];return `<button class="card ${d.type}" style="width:100%;flex:auto" onclick="chooseReward('${id}')"><span class="cost">${d.cost}</span><h3>${d.name}</h3><p>${d.description}</p><small>${d.rarity}</small></button>`}).join("")}</div><button class="btn" style="width:100%;margin-top:14px" onclick="skipReward()">건너뛰기</button></section>`;
    }
    window.claimEliteRelic=()=>{gainRelic(state);saveRun();renderReward(false)};window.chooseReward=id=>{addCard(state,id);saveRun();advance()};window.skipReward=()=>{saveRun();advance()};

    function renderEvent(){
      state.screen="event";const ev=pick(EVENTS);state.event=ev;
      app.innerHTML=`<section class="screen">${topbar()}<div class="panel" style="padding:19px;margin-top:25px"><div style="font-size:2.5rem">✧</div><h1 class="title">${ev[0]}</h1><p class="sub">${ev[1]}</p></div><div style="margin-top:18px">${[2,4,6].map(i=>`<button class="panel choice" onclick="eventChoice(${i})"><h3>${ev[i]}</h3></button>`).join("")}</div></section>`;
    }
    window.eventChoice=i=>{const ok=state.event[i+1](state);if(!ok){toast("골드가 부족합니다.",true);return}if(checkDeath())return;saveRun();advance()};

    function renderShop(){
      state.screen="shop";state.shopCards=[randomCard(),randomCard("uncommon"),randomCard()];state.shopRelic=pick(RELICS.filter(r=>!state.relics.includes(r)).map(r=>r.id));
      const item=(title,desc,cost,fn)=>`<div class="panel shop-item"><div><h3>${title}</h3><p>${desc}</p></div><button class="btn gold-btn" onclick="${fn}" ${state.gold<cost?"disabled":""}>${cost} ◈</button></div>`;
      app.innerHTML=`<section class="screen">${topbar()}<h1 class="title">공허 상점</h1><p class="sub" style="margin-bottom:14px">당신의 골드는 여기서만 빛납니다.</p>${state.shopCards.map((id,i)=>{const d=CARDS[id],cost=d.rarity==="rare"?95:d.rarity==="uncommon"?62:38;return item(d.name,d.description,cost,`buyCard(${i},${cost})`)}).join("")}${item(RELIC[state.shopRelic].name,RELIC[state.shopRelic].desc,115,`buyRelic(115)`)}${item("치유의 병","HP를 18 회복합니다.",28,"buyHeal(28)")}${item("카드 제거","무작위 기본 카드를 덱에서 제거합니다.",state.removeCost,`removeShopCard(${state.removeCost})`)}<button class="btn" style="width:100%;margin-top:10px" onclick="advance()">상점 나가기</button></section>`;
    }
    window.buyCard=(i,c)=>{if(state.gold<c)return;state.gold-=c;addCard(state,state.shopCards[i]);state.shopCards.splice(i,1);toast("카드를 구입했습니다.");saveRun();renderShop()};
    window.buyRelic=c=>{if(state.gold<c)return;state.gold-=c;gainRelic(state);state.shopRelic=null;saveRun();renderShop()};
    window.buyHeal=c=>{if(state.gold<c)return;state.gold-=c;heal(state,18);saveRun();renderShop()};
    function removeRandomCard(s){const idx=s.deck.findIndex(x=>["slash","guard","jab"].includes(x.id));if(idx>=0)s.deck.splice(idx,1);else if(s.deck.length)s.deck.splice(rng(0,s.deck.length-1),1)}
    window.removeShopCard=c=>{if(state.gold<c)return;state.gold-=c;removeRandomCard(state);state.removeCost+=20;toast("카드가 제거되었습니다.");saveRun();renderShop()};

    function renderRest(){
      state.screen="rest";app.innerHTML=`<section class="screen">${topbar()}<div class="panel" style="padding:20px;margin-top:28px"><div style="font-size:2.8rem">♨</div><h1 class="title">잿빛 휴식처</h1><p class="sub">불꽃이 잠시 공허를 밀어냅니다.</p></div><button class="panel choice" style="margin-top:15px" onclick="restHeal()"><h3>♥ 회복</h3><p>HP를 ${22+(state.relics.includes("old_map")?8:0)} 회복합니다.</p></button><button class="panel choice" onclick="renderUpgrade()"><h3>✦ 카드 강화</h3><p>덱의 카드 하나를 강화합니다.</p></button></section>`}
    window.restHeal=()=>{heal(state,22+(state.relics.includes("old_map")?8:0));saveRun();advance()};
    function upgradeRandom(s){const x=pick(s.deck);if(x)x.up=true}
    function renderUpgrade(){app.innerHTML=`<section class="screen">${topbar()}<h1 class="title">강화할 카드</h1><p class="sub">강화된 카드는 피해 또는 방어도가 증가합니다.</p><div class="reward-grid" style="margin-top:15px">${state.deck.map((x,i)=>{const d=CARDS[x.id];return `<button class="card ${d.type}" ${x.up?"disabled":""} onclick="upgradeCard(${i})"><span class="cost">${d.cost}</span><h3>${d.name}${x.up?" +":""}</h3><p>${cardDesc(d,true)}</p></button>`}).join("")}</div></section>`}
    window.upgradeCard=i=>{if(!state.deck[i]||state.deck[i].up)return;state.deck[i].up=true;toast("카드가 강화되었습니다!");saveRun();advance()};

    function renderCodex(){
      const data=codexTab==="cards"?Object.values(CARDS):codexTab==="relics"?RELICS:Object.entries(ENEMIES).map(([id,x])=>({id,name:x.name,desc:x.boss?"보스":"공허의 적"}));
      const key=codexTab;app.innerHTML=`<section class="screen"><button class="btn" onclick="renderMenu()">← 메뉴</button><h1 class="title">도감</h1><div class="codex-tabs">${["cards","relics","enemies"].map(x=>`<button class="btn ${x===codexTab?"primary":""}" onclick="setCodex('${x}')">${({cards:"카드",relics:"유물",enemies:"적"})[x]}</button>`).join("")}</div><div class="codex-list">${data.map(x=>{const known=profile.discovered[key].includes(x.id);return `<div class="codex-entry ${known?"":"unknown"}"><div><b>${known?x.name:"???"}</b><p style="margin:3px 0 0;font-size:.76rem">${known?(x.description||x.desc||"발견한 기록"):"아직 발견하지 못했습니다."}</p></div><span>${known?"✓":"?"}</span></div>`}).join("")}</div></section>`}
    window.setCodex=x=>{codexTab=x;renderCodex()};
    function renderUnlocks(){app.innerHTML=`<section class="screen"><button class="btn" onclick="renderMenu()">← 메뉴</button><h1 class="title">영혼 해금</h1><div class="panel" style="padding:18px;margin:14px 0"><span class="logo" style="color:#f6c85f">SOUL SHARDS</span><div style="font-size:2.3rem;font-weight:800;color:var(--gold)">${profile.shards}</div><p class="sub">런의 실패와 승리에서 얻은 조각입니다.</p></div><div class="panel" style="padding:14px"><h2 style="margin:0">암살자</h2><p class="sub">첫 번째 보스를 처치하면 영구 해금됩니다.</p><span class="badge">${profile.unlocked.includes("assassin")?"해금 완료":"잠김"}</span></div></section>`}
    function renderSettings(){app.innerHTML=`<section class="screen"><button class="btn" onclick="renderMenu()">← 메뉴</button><h1 class="title">설정</h1><div class="panel" style="padding:17px;margin-top:15px"><h2 style="margin-top:0">저장 관리</h2><p class="sub">게임은 주요 행동마다 현재 런과 영구 진행도를 이 브라우저에 자동 저장합니다.</p><button class="btn danger" style="margin-top:15px;width:100%" onclick="clearAll()">모든 저장 데이터 초기화</button></div></section>`}
    window.clearAll=()=>{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(RUN_KEY);loadProfile();toast("저장 데이터를 초기화했습니다.");renderMenu()};

    function fail(){
      const seconds=Math.floor((Date.now()-state.start)/1000), shards=3+state.region+(state.tempShards||0);profile.shards+=shards;profile.bestRegion=Math.max(profile.bestRegion,state.region);saveProfile();localStorage.removeItem(RUN_KEY);
      const summary={region:state.region,kills:state.kills,gold:state.gold,relics:state.relics.length,time:formatTime(seconds),shards};state.runActive=false;
      app.innerHTML=`<section class="screen result fail"><p class="logo">VOID DECK</p><h1>RUN FAILED</h1><p class="sub">공허가 당신의 발자국을 삼켰습니다.</p><div class="panel summary">도달 지역 <b>${summary.region}</b><br>처치한 적 <b>${summary.kills}</b><br>획득 골드 <b>${summary.gold}</b><br>유물 <b>${summary.relics}</b><br>플레이 시간 <b>${summary.time}</b><br>영혼 조각 <b class="gold">+${summary.shards}</b></div><div class="menu-actions"><button class="btn primary" onclick="renderCharacterSelect()">다시 시작</button><button class="btn" onclick="renderMenu()">메인 메뉴</button></div></section>`;
    }
    function victory(){
      const seconds=Math.floor((Date.now()-state.start)/1000), shards=15+(state.tempShards||0);profile.shards+=shards;profile.wins++;profile.bestRegion=3;if(!profile.unlocked.includes("assassin"))profile.unlocked.push("assassin");saveProfile();localStorage.removeItem(RUN_KEY);const deck=state.deck.map(x=>CARDS[x.id]?.name+(x.up?"+":"")).join(" · ");
      state.runActive=false;app.innerHTML=`<section class="screen result win"><p class="logo">VOID DECK</p><h1>VICTORY</h1><p class="sub">VOID의 심장이 마침내 침묵합니다.</p><div class="panel summary">클리어 시간 <b>${formatTime(seconds)}</b><br>사용 캐릭터 <b>${CHARACTERS[state.character].name}</b><br>처치한 적 <b>${state.kills}</b><br>유물 <b>${state.relics.map(x=>RELIC[x]?.name).join(" · ")||"없음"}</b><br>영혼 조각 <b class="gold">+${shards}</b><hr style="border-color:#34415f">덱<br><small>${esc(deck)}</small></div><div class="menu-actions"><button class="btn primary" onclick="renderCharacterSelect()">새 런 시작</button><button class="btn" onclick="renderMenu()">메인 메뉴</button></div></section>`;
    }
    const formatTime=s=>`${Math.floor(s/60)}분 ${s%60}초`;
    function renderCurrent(){if(!state)return renderMenu();if(state.screen==="combat")renderCombat();else if(state.screen==="map")renderMap();else renderMap()}
    loadProfile();renderMenu();window.lucide?.createIcons();
  })();
  </script>
 </body>
</html>
